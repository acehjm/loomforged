<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eeece7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23211f1c'/%3E%3Cpath d='M8 10l3 12 5-8 5 8 3-12' fill='none' stroke='%23f3eee5' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>WALI 项目看板</title>
  <style>
    :root {
      --canvas:#eeece7; --paper:#f8f7f3; --white:#fff; --ink:#211f1c;
      --muted:#605c55; --faint:#8a857c; --line:#d7d3cb; --strong:#bbb5aa;
      --accent:#b65436; --soft:#f1ddd5; --positive:#39705a;
      --warning:#9b6a2d; --danger:#a7463e; --radius:10px;
      --page:min(1440px,calc(100vw - 56px));
      color:var(--ink); background:var(--canvas);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      font-synthesis:none;
    }
    *{box-sizing:border-box} html{min-width:320px;background:var(--canvas)}
    body{min-height:100vh;margin:0;background:linear-gradient(rgba(33,31,28,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(33,31,28,.027) 1px,transparent 1px),var(--canvas);background-size:40px 40px}
    .shell{width:var(--page);margin:0 auto;padding:24px 0 32px}
    .topbar{position:sticky;z-index:10;top:0;display:flex;align-items:center;justify-content:space-between;min-height:64px;margin-bottom:18px;padding:10px 0;border-bottom:1px solid var(--strong);background:rgba(238,236,231,.92);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{display:grid;width:38px;height:38px;flex:0 0 auto;place-items:center;border-radius:9px;background:var(--ink);color:var(--paper);font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.05em}
    .brand-name{display:block;font-size:15px;font-weight:760;letter-spacing:.08em}
    .brand-note{display:block;margin-top:1px;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .status-strip{display:flex;align-items:center;justify-content:flex-end;gap:16px;min-width:0;color:var(--muted);font-size:12px}
    .status-pair{display:grid;gap:2px}.status-label,.kicker{color:var(--faint);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.status-value{color:var(--ink);font-weight:680}
    .sync{display:inline-flex;align-items:center;gap:7px;min-width:104px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--muted);font-size:11px;font-weight:680;white-space:nowrap}
    .dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--positive);box-shadow:0 0 0 3px rgba(57,112,90,.12)}
    .sync[data-state="loading"] .dot{background:var(--warning);box-shadow:0 0 0 3px rgba(155,106,45,.12)}
    .sync[data-state="error"] .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(167,70,62,.12)}
    .dashboard{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:18px}
    .panel{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:0 1px 0 rgba(33,31,28,.03)}
    .goal{display:grid;min-height:350px;grid-template-rows:1fr auto;background:var(--white)}
    .goal-copy{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(26px,4vw,54px)}
    .eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .eyebrow:before{width:24px;height:2px;background:currentColor;content:""}
    h1{max-width:900px;margin:0;font-family:ui-serif,Georgia,"Noto Serif SC","Songti SC",serif;font-size:clamp(30px,4.2vw,58px);font-weight:560;letter-spacing:-.035em;line-height:1.12;text-wrap:balance}
    .goal-meta{display:flex;align-items:center;gap:18px;margin-top:36px;color:var(--muted);font-size:12px}.goal-meta strong{color:var(--ink);font-weight:700}
    .current{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px clamp(26px,4vw,54px);border-top:1px solid var(--line);background:#f0eee8}
    .current-label{color:var(--faint);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .current-title{overflow:hidden;color:var(--ink);font-size:14px;font-weight:680;text-overflow:ellipsis;white-space:nowrap}
    .current-next{max-width:220px;overflow:hidden;color:var(--muted);font-size:11px;text-align:right;text-overflow:ellipsis;white-space:nowrap}
    .visual{position:relative;min-height:350px;background:#d7d4ce}.visual img{display:block;width:100%;height:100%;min-height:350px;object-fit:cover;object-position:center;filter:saturate(.8) contrast(.98)}
    .visual-caption{position:absolute;right:12px;bottom:12px;left:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:16px;border:1px solid rgba(255,255,255,.48);border-radius:8px;background:rgba(248,247,243,.91);backdrop-filter:blur(12px)}
    .visual-caption h2{margin:3px 0 0;font-size:18px;font-weight:720;letter-spacing:-.02em}.team-count{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
    .metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr)}.metric{min-width:0;padding:20px 24px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}
    .metric-label{display:block;margin-bottom:8px;color:var(--faint);font-size:10px;font-weight:680;letter-spacing:.08em}.metric-value{display:flex;align-items:baseline;gap:5px;font:620 24px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em}.metric-suffix{color:var(--faint);font-size:10px;font-weight:600;letter-spacing:0}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-height:75px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
    .section-title{margin:4px 0 0;font-size:18px;font-weight:720;letter-spacing:-.025em}.section-note{color:var(--faint);font-size:11px;text-align:right}
    .work,.agents{min-height:410px}.work-table{width:100%;border-collapse:collapse;table-layout:fixed}.work-table th{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--faint);font-size:9px;font-weight:760;letter-spacing:.09em;text-align:left;text-transform:uppercase}
    .work-table td{padding:17px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;vertical-align:middle}.work-table tbody tr:last-child td{border-bottom:0}
    .task-id{width:84px;color:var(--accent)!important;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace!important}.task-name{width:40%;color:var(--ink)!important;font-size:13px!important;font-weight:640!important;line-height:1.45}.owner{width:20%}.task-state{width:100px}
    .state{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}.state:before{width:14px;height:2px;background:var(--strong);content:""}.state[data-tone="active"]:before{background:var(--accent)}.state[data-tone="positive"]:before{background:var(--positive)}.state[data-tone="danger"]:before{background:var(--danger)}.state[data-tone="warning"]:before{background:var(--warning)}
    .changed{background-color:var(--soft);transition:background-color 900ms cubic-bezier(.23,1,.32,1)}
    .empty{display:grid;min-height:160px;padding:24px;place-items:center;color:var(--faint);font-size:12px;text-align:center}
    ul{margin:0;padding:0;list-style:none}.agent-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.agent-row:last-child,.issue-row:last-child,.activity-row:last-child{border-bottom:0}
    .avatar{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#e2dfd8;object-fit:cover}.agent-name,.agent-role,.agent-work{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent-name{color:var(--ink);font-size:12px;font-weight:700}.agent-role{margin-top:3px;color:var(--accent);font-size:10px;font-weight:680;letter-spacing:.04em;text-transform:uppercase}.agent-work{margin-top:3px;color:var(--faint);font-size:10px;line-height:1.35}
    .lower{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.7fr);gap:18px}.issue-row{display:grid;grid-template-columns:72px minmax(0,1fr) 100px 100px;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.issue-id{color:var(--danger);font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace}.issue-title{color:var(--ink);font-size:12px;font-weight:630;line-height:1.45}.issue-owner{overflow:hidden;color:var(--faint);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
    .activity-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;align-items:start;padding:16px 20px;border-bottom:1px solid var(--line)}.activity-time{color:var(--faint);font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.activity-message{color:var(--ink);font-size:12px;line-height:1.45}
    footer{display:flex;justify-content:space-between;gap:24px;padding:18px 2px 0;color:var(--faint);font-size:10px}footer strong{color:var(--muted);font-weight:700}
    @media(max-width:980px){:root{--page:min(100% - 32px,760px)}.dashboard,.lower{grid-template-columns:1fr}.metrics,.lower{grid-column:auto}.visual{min-height:390px}}
    @media(max-width:640px){:root{--page:calc(100% - 24px)}.shell{padding-top:8px}.topbar{align-items:flex-start;padding:10px 0 12px}.brand-note,.status-pair{display:none}.sync{width:30px;min-width:30px;height:30px;justify-content:center;padding:0}#sync-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.goal-copy{padding:28px 22px}h1{font-size:clamp(30px,10vw,44px)}.goal-meta{flex-wrap:wrap;gap:8px 16px;margin-top:28px}.current{grid-template-columns:1fr;gap:6px;padding:16px 22px}.current-next{max-width:none;text-align:left}.visual,.visual img{min-height:330px}.metrics{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--line)}.metric:nth-child(2){border-right:0}.metric:nth-child(n+3){border-bottom:0}.work-table,.work-table tbody{display:block;width:100%}.work-table thead{display:none}.work-table tr{display:grid;width:100%;grid-template-columns:68px minmax(0,1fr) auto;gap:6px 10px;padding:15px 18px;border-bottom:1px solid var(--line)}.work-table td,.task-id,.task-name,.owner,.task-state{display:block;width:auto;padding:0;border:0}.task-name{grid-column:2/-1}.owner{grid-column:2;font-size:10px}.task-state{grid-column:3}.issue-row{grid-template-columns:64px minmax(0,1fr) auto;gap:7px 10px}.issue-owner{grid-column:2}.issue-row .state{grid-column:3;grid-row:1/span 2}footer{display:block;line-height:1.6}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">0x3</span><span><span class="brand-name">WALI</span><span class="brand-note">Agent workbench</span></span></div>
      <div class="status-strip">
        <span class="status-pair"><span class="status-label">Goal</span><span class="status-value" id="goal-id">—</span></span>
        <span class="status-pair"><span class="status-label">Phase</span><span class="status-value" id="goal-phase">—</span></span>
        <span class="sync" id="sync" data-state="loading" role="status" aria-live="polite"><span class="dot"></span><span id="sync-label">正在连接</span></span>
      </div>
    </header>
    <main class="dashboard">
      <section class="panel goal">
        <div class="goal-copy"><div><p class="eyebrow">当前目标</p><h1 id="goal-heading">正在读取项目状态</h1></div><div class="goal-meta"><span>状态 <strong id="goal-status">—</strong></span><span>确认 <strong id="goal-confirmation">—</strong></span></div></div>
        <div class="current" id="current"><span class="current-label">当前工作</span><span class="current-title" id="current-title">等待任务信息</span><span class="current-next" id="current-next">—</span></div>
      </section>
      <section class="panel visual"><img id="team-art" alt="多位 WALI Agent 在同一工作台协作"><div class="visual-caption"><div><span class="kicker">Collaboration</span><h2>协作中的团队</h2></div><span class="team-count" id="team-count">— AGENTS</span></div></section>
      <section class="panel metrics">
        <div class="metric"><span class="metric-label">全部任务</span><span class="metric-value"><span id="task-count">—</span><span class="metric-suffix">项</span></span></div>
        <div class="metric"><span class="metric-label">正在推进</span><span class="metric-value"><span id="working-count">—</span><span class="metric-suffix">项</span></span></div>
        <div class="metric"><span class="metric-label">未关闭问题</span><span class="metric-value"><span id="issue-count">—</span><span class="metric-suffix">项</span></span></div>
        <div class="metric"><span class="metric-label">验收进度</span><span class="metric-value"><span id="criteria-count">—</span><span class="metric-suffix" id="criteria-total">/ —</span></span></div>
      </section>
      <section class="panel work"><header class="section-head"><div><span class="kicker">Workstream</span><h2 class="section-title">工作队列</h2></div><span class="section-note" id="work-note">按执行状态排序</span></header><div id="work-content"><div class="empty">等待任务信息</div></div></section>
      <section class="panel agents"><header class="section-head"><div><span class="kicker">Agents</span><h2 class="section-title">协作成员</h2></div><span class="section-note" id="runtime-note">状态待接入</span></header><div id="agent-content"><div class="empty">等待协作信息</div></div></section>
      <div class="lower">
        <section class="panel"><header class="section-head"><div><span class="kicker">Issues</span><h2 class="section-title">待处理问题</h2></div><span class="section-note" id="issues-note">0 项待处理</span></header><div id="issue-content"><div class="empty">当前没有待处理问题</div></div></section>
        <section class="panel"><header class="section-head"><div><span class="kicker">Activity</span><h2 class="section-title">最近协作</h2></div><span class="section-note">最新在前</span></header><div id="activity-content"><div class="empty">暂无运行事件</div></div></section>
      </div>
    </main>
    <footer><span><strong>WALI 只读看板</strong> · 只读页面，不会修改项目状态</span><span id="last-updated">每 1 秒自动更新</span></footer>
  </div>

    function sync(state,value){document.getElementById("sync").dataset.state=state;document.getElementById("sync-label").textContent=value}
    async function poll(){window.clearTimeout(timer);if(document.hidden)return;if(!ready)sync("loading","正在连接");if(controller)controller.abort();controller=new AbortController();try{const response=await fetch(API_ENDPOINT,{cache:"no-store",signal:controller.signal,headers:{Accept:"application/json"}}),state=await response.json();if(!response.ok||!state.ok)throw new Error(state.error||"状态读取失败");render(state);sync("live","LIVE · 每 1 秒")}catch(error){if(error.name==="AbortError")return;sync("error",ready?"连接中断":"暂时不可用")}finally{controller=null;if(!document.hidden)timer=window.setTimeout(poll,POLL_INTERVAL_MS)}}
    document.addEventListener("visibilitychange",function(){window.clearTimeout(timer);if(document.hidden){if(controller)controller.abort();sync("loading","已暂停")}else poll()});
    poll();
  </script>
</body>
</html>
